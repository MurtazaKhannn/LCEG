<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LCEG Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-brand">
        <img src="/logo.svg" alt="LCEG Logo" class="brand-logo" />
        <div>
          <h1>LCEG Settings</h1>
          <p class="desc">Configure your free Gemini API key for AI-generated examples.</p>
        </div>
      </div>

      <form id="settings-form">
        <div class="field">
          <label for="api-key">Gemini API Key</label>
          <input type="password" id="api-key" placeholder="AIza..." autocomplete="off" />
          <p class="hint">
            Get a free key from
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>.
            No credit card required.
          </p>
        </div>

        <div class="field">
          <label for="model">Model</label>
          <select id="model">
            <option value="gemini-2.5-flash">gemini-2.5-flash (recommended)</option>
            <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
          </select>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="test-btn" class="btn btn-secondary">Test Connection</button>
        </div>
      </form>

      <div id="status" class="status hidden"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
